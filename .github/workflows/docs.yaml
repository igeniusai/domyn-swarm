name: Docs

on:
  # A version becomes publishable when its tag exists, which is not when the bump
  # commit is pushed: that fires the push event below while the tag is still
  # minutes away, so the version scan finds nothing. Both release styles are
  # covered -- publishing a release through the UI, which creates the tag, and
  # pushing a tag from the CLI. Doing both fires two runs; the pages concurrency
  # group serialises them and the second simply republishes the same site.
  #
  # Both need the github-pages environment to permit deploys from v* tags, since
  # the ref of either event is the tag rather than a branch.
  release:
    types: [published]
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Pages allows one deployment at a time, and cancelling a half-finished one can
# leave the site partially replaced, so queue rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  # How many released minors to publish alongside latest. Older ones stay
  # reachable in git; the step below says which it dropped.
  KEEP_MINORS: 5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Tags are needed to rebuild released versions, so no shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # latest must track main whatever triggered the run. A release event checks
      # out the tag, and building that as "latest" would publish a release's
      # content under a name that is supposed to mean "current main". Moving the
      # workspace before the dependency sync keeps every later step consistent.
      # Skipped on pull requests, where the point is to build the PR's own ref.
      - name: Build latest from main, not from the triggering ref
        if: github.event_name != 'pull_request'
        run: git switch --detach origin/main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pipx install uv==0.8.19

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-docs-${{ runner.os }}-

      # The extras are required, not optional: building the CLI reference imports
      # every lazily-loaded sub-app, including the Lepton SDK.
      - name: Sync dependencies
        run: uv sync --all-extras --group docs --frozen

      # --keep-going so a PR author sees every warning at once, not just the first.
      - name: Build latest
        env:
          DOCS_VERSION: latest
        run: uv run sphinx-build -W --keep-going -b html docs site/latest

      - name: Check the docs tests
        run: uv run pytest tests/docs -v --no-cov

      # Non-blocking: a third-party outage must not fail an unrelated PR. The -W
      # build above is the blocking gate.
      - name: Link check
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: uv run sphinx-build -b linkcheck docs linkcheck

      # Every deploy replaces the whole site, so released versions are rebuilt
      # from their tags rather than accumulated. That makes what is published a
      # function of the repository: nothing can drift, and nothing is lost if a
      # deploy is re-run. Tags predating the docs tree have no conf.py and are
      # skipped.
      - name: Build released versions
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          declare -A newest_patch_for_minor=()
          while read -r tag; do
            [ -n "$tag" ] || continue
            git cat-file -e "${tag}:docs/conf.py" 2>/dev/null || continue
            minor="v$(printf '%s' "${tag#v}" | cut -d. -f1,2)"
            current="${newest_patch_for_minor[$minor]:-}"
            if [ -z "$current" ] || [ "$(printf '%s\n%s\n' "$current" "$tag" | sort -V | tail -1)" = "$tag" ]; then
              newest_patch_for_minor[$minor]="$tag"
            fi
          done < <(git tag --list 'v*')

          if [ ${#newest_patch_for_minor[@]} -eq 0 ]; then
            echo "No tag contains docs/conf.py yet; publishing latest only." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          minors=$(printf '%s\n' "${!newest_patch_for_minor[@]}" | sort -Vr)
          keep=$(printf '%s\n' "$minors" | head -n "${KEEP_MINORS}")
          dropped=$(printf '%s\n' "$minors" | tail -n +$((KEEP_MINORS + 1)))
          if [ -n "$dropped" ]; then
            echo "Not published (older than the newest ${KEEP_MINORS} minors): $(echo $dropped)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          for minor in $keep; do
            tag="${newest_patch_for_minor[$minor]}"
            echo "::group::building ${minor} from ${tag}"
            rm -rf "../docs-${minor}"
            git worktree add --detach "../docs-${minor}" "$tag"
            (
              cd "../docs-${minor}"
              uv sync --all-extras --group docs --frozen
              DOCS_VERSION="$minor" uv run sphinx-build -b html docs "$GITHUB_WORKSPACE/site/${minor}"
            )
            git worktree remove --force "../docs-${minor}"
            echo "::endgroup::"
          done

      # switcher.json must live at a URL that is stable across versions, because
      # every published version fetches the same file to build its dropdown.
      - name: Assemble the site root
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          uv run python docs/update_switcher.py site
          # Pages would otherwise run Jekyll, which ignores _static/ and _sources/.
          touch site/.nojekyll
          cat site/switcher.json

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # latest comes from main and released versions from their tags, so the output
    # is identical whether a push, a release or a manual run triggered this.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
