name: E2E (Slurm)

on:
  pull_request:
    paths:
      - "src/domyn_swarm/backends/**"
      - "src/domyn_swarm/templates/**"
      - "src/domyn_swarm/runtime/**"
      - "src/domyn_swarm/cli/**"
      - "src/domyn_swarm/core/**"
      - "src/domyn_swarm/config/**"
      - "tests/e2e/**"
      - "uv.lock"
      - ".github/workflows/e2e-slurm.yaml"
  push:
    branches: [main]
    paths:
      - "src/domyn_swarm/backends/**"
      - "src/domyn_swarm/templates/**"
      - "src/domyn_swarm/runtime/**"
      - "src/domyn_swarm/cli/**"
      - "src/domyn_swarm/core/**"
      - "src/domyn_swarm/config/**"
      - "tests/e2e/**"
      - "uv.lock"
      - ".github/workflows/e2e-slurm.yaml"
  workflow_dispatch:
    inputs:
      tier:
        description: Tier to run
        type: choice
        options: [fast, vllm, both]
        default: fast
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-slurm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    if: github.event_name != 'workflow_dispatch' || inputs.tier != 'vllm'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the cluster image
        uses: docker/build-push-action@v6
        with:
          context: tests/e2e/slurm/docker
          target: fast
          tags: domyn-swarm-e2e:fast
          load: true
          cache-from: type=gha,scope=e2e-slurm-fast
          cache-to: type=gha,mode=max,scope=e2e-slurm-fast

      - name: Run the fast tier
        env:
          E2E_SKIP_BUILD: "1"
        run: tests/e2e/slurm/run.sh fast

      - name: Upload the cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-slurm-fast-logs
          path: output/e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

  vllm:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tier != 'fast')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the cluster image
        uses: docker/build-push-action@v6
        with:
          context: tests/e2e/slurm/docker
          target: vllm
          tags: domyn-swarm-e2e:vllm
          load: true
          cache-from: type=gha,scope=e2e-slurm-vllm
          cache-to: type=gha,mode=max,scope=e2e-slurm-vllm

      - name: Run the vLLM tier
        env:
          E2E_SKIP_BUILD: "1"
        run: tests/e2e/slurm/run.sh vllm

      - name: Upload the cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-slurm-vllm-logs
          path: output/e2e-logs/
          if-no-files-found: ignore
          retention-days: 7
